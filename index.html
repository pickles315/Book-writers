<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BookWriters — Publish and read EPUBs</title>
<meta name="description" content="Publish EPUB books with covers, genres, and age ratings. Discover and read stories in your browser.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#20231f;--muted:#6e746c;--paper:#f8f7f2;--card:#fffefa;--line:#e4e3da;--green:#315c45;--green2:#e6efe7;--gold:#e7b86b;--red:#a33c35}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 15px;background:var(--green);color:white;font-weight:650}button:hover{filter:brightness(.94)}button.secondary{background:var(--green2);color:var(--green)}button.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}button.danger{background:#f7e8e5;color:var(--red)}button:disabled{opacity:.5;cursor:not-allowed}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fffefa;color:var(--ink);outline-color:var(--green)}textarea{resize:vertical;min-height:100px}label{display:block;font-size:.9rem;font-weight:650;margin:12px 0 6px}.small{font-size:.88rem;color:var(--muted)}.hidden{display:none!important}.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.nav{max-width:1180px;margin:auto;padding:14px 22px;display:flex;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:10px;font-size:1.2rem;font-weight:850;letter-spacing:-.04em;white-space:nowrap}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--green);color:white;font-family:Georgia,serif;font-size:22px}.navright{display:flex;gap:8px;align-items:center;margin-left:auto}.wrap{max-width:1180px;margin:0 auto;padding:28px 22px 70px}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:stretch;margin-bottom:28px}.hero-main{background:var(--green);color:white;border-radius:22px;padding:clamp(25px,4vw,48px);position:relative;overflow:hidden}.hero-main:after{content:"“";font:250px Georgia,serif;position:absolute;right:10px;bottom:-100px;color:#ffffff14}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.75rem;font-weight:800;color:var(--gold)}h1{font:700 clamp(2.2rem,5vw,4.2rem)/1.04 Georgia,serif;letter-spacing:-.04em;margin:13px 0 18px;max-width:650px}.hero-main p{max-width:510px;color:#e1e9e0;font-size:1.05rem}.hero-main button{background:var(--gold);color:#33291b;margin-top:8px}.hero-side{border:1px solid var(--line);border-radius:22px;padding:26px;background:#f0eee4;display:flex;flex-direction:column;justify-content:space-between}.hero-side h2{font:700 1.8rem Georgia,serif;margin:8px 0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:26px 0 16px}.section-head h2{font:700 1.8rem Georgia,serif;margin:0}.section-head p{margin:4px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.book{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:20px;display:flex;flex-direction:column;min-height:235px}.book h3{font:700 1.35rem/1.2 Georgia,serif;margin:15px 0 8px}.book p{color:var(--muted);font-size:.92rem;margin:0 0 18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.book-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}.author{font-size:.82rem;color:var(--muted)}.genre{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--green);background:var(--green2);border-radius:20px;padding:5px 9px}.empty{border:1px dashed #c9c9bd;border-radius:16px;padding:35px;text-align:center;color:var(--muted);grid-column:1/-1}.loading{color:var(--muted);padding:20px 0}.notice{padding:12px 14px;border-radius:10px;background:var(--green2);color:var(--green);margin:12px 0}.notice.error{background:#f8e9e6;color:var(--red)}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#f1eadc;color:#70572d;font-size:.75rem;font-weight:700}.footer{border-top:1px solid var(--line);padding:22px;text-align:center;color:var(--muted);font-size:.85rem}
@media(max-width:800px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.nav{flex-wrap:wrap;gap:10px}.wrap{padding-top:20px}}
@media(max-width:540px){.grid{grid-template-columns:1fr}.nav{padding:10px 14px}.navright .small{display:none}.wrap{padding-left:14px;padding-right:14px}.hero-main{padding:25px}.section-head{align-items:start;flex-direction:column}}
</style>
</head>
<body>
<header class="top"><div class="nav">
  <div class="brand"><span class="mark">B</span> BookWriters</div>
  <div class="navright"><span class="small" id="epub-signed-label">Not signed in</span><button id="epub-auth-button" type="button">Sign in</button></div>
</div></header>
<main class="wrap"></main>
<footer class="footer">BookWriters · A home for EPUB books and readers.</footer>
<script src="./epub-library.js"></script>
</body>
</html>
