name: Build BookWriters Android APK

on:
  push:
    branches: [android-app-webview, main]
    paths:
      - "android/**"
      - "index.html"
      - "library.js"
      - "book-details.js"
      - "requests.js"
      - "features.js"
      - "offline.js"
      - "sw.js"
      - "supabase/functions/library-api/**"
      - "supabase/migrations/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "index.html"
      - "library.js"
      - "book-details.js"
      - "supabase/functions/library-api/**"
      - "supabase/migrations/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check library.js && node --check book-details.js && node --check requests.js && node --check features.js && node --check offline.js && node --check sw.js

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BookWriters-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
